services:
  db:
    image: postgres:15
    container_name: rpm_db
    environment:
      POSTGRES_USER: sirius
      POSTGRES_PASSWORD: sirius
      POSTGRES_DB: sirius_food
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sirius -d sirius_food"]
      interval: 3s
      timeout: 3s
      retries: 5

  app_redis:
    image: redis:7
    container_name: rpm_redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 5

  # Микросервис доставки (gRPC, порт 50051)
  delivery_grpc:
    build: .
    container_name: rpm_delivery_grpc
    ports:
      - "50051:50051"
    environment:
      DATABASE_URL: postgresql://sirius:sirius@db:5432/sirius_food
      REDIS_URL: redis://app_redis:6379/0
    depends_on:
      db:
        condition: service_healthy
    command: ["python3", "delivery_server.py"]
    restart: unless-stopped

  # Основной сервер FastAPI (Swagger UI на порту 8000)
  api:
    build: .
    container_name: rpm_api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://sirius:sirius@db:5432/sirius_food
      REDIS_URL: redis://app_redis:6379/0
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_TEST_ENABLED: ${SENTRY_TEST_ENABLED:-0}
      DELIVERY_GRPC_HOST: delivery_grpc
      DELIVERY_GRPC_PORT: 50051
      REPOSITORY_BACKEND: grpc
    depends_on:
      db:
        condition: service_healthy
      app_redis:
        condition: service_healthy
      delivery_grpc:
        condition: service_started
    entrypoint: ["/app/scripts/entrypoint.sh"]
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  # Celery Воркер (обработка фоновых задач PDF, Email, SMS, DLQ)
  celery_worker:
    build: .
    container_name: rpm_celery_worker
    environment:
      DATABASE_URL: postgresql://sirius:sirius@db:5432/sirius_food
      REDIS_URL: redis://app_redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      app_redis:
        condition: service_healthy
    command: ["celery", "-A", "app.core.celery_app", "worker", "--loglevel=info", "-Q", "default,dlq"]
    restart: unless-stopped

  # Celery Beat (планировщик периодических задач каждую минуту)
  celery_beat:
    build: .
    container_name: rpm_celery_beat
    environment:
      DATABASE_URL: postgresql://sirius:sirius@db:5432/sirius_food
      REDIS_URL: redis://app_redis:6379/0
    depends_on:
      app_redis:
        condition: service_healthy
    command: ["celery", "-A", "app.core.celery_app", "beat", "--loglevel=info"]
    restart: unless-stopped

  # Flower Dashboard (веб-интерфейс мониторинга Celery на порту 5555)
  flower:
    build: .
    container_name: rpm_flower
    ports:
      - "5555:5555"
    environment:
      REDIS_URL: redis://app_redis:6379/0
    depends_on:
      app_redis:
        condition: service_healthy
    command: ["celery", "-A", "app.core.celery_app", "flower", "--port=5555"]
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: sirius
      RABBITMQ_DEFAULT_PASS: sirius
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbitmq_prometheus return_per_object_metrics true"
    ports:
      - "5672:5672"
      - "15672:15672"
    command: /bin/sh -c "rabbitmq-plugins enable --offline rabbitmq_prometheus && rabbitmq-server"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

  event_publisher: &event_worker
    build: .
    environment: &event_environment
      DATABASE_URL: postgresql://sirius:sirius@db:5432/sirius_food
      RABBITMQ_URL: amqp://sirius:sirius@rabbitmq:5672//
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://jaeger:4318/v1/traces
      SENTRY_DSN: ${SENTRY_DSN:-}
    depends_on:
      api:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    command: ["python", "-m", "app.events.publisher"]
    restart: unless-stopped

  kitchen:
    <<: *event_worker
    command: ["python", "-m", "app.events.consumer", "kitchen"]

  delivery_events:
    <<: *event_worker
    command: ["python", "-m", "app.events.consumer", "delivery"]

  compensation:
    <<: *event_worker
    command: ["python", "-m", "app.events.consumer", "compensation"]

  loyalty:
    <<: *event_worker
    command: ["python", "-m", "app.events.consumer", "loyalty"]

  cancellation:
    <<: *event_worker
    command: ["python", "-m", "app.events.consumer", "cancellation"]

  jaeger:
    image: jaegertracing/all-in-one:1.65.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686"]

  prometheus:
    image: prom/prometheus:v2.55.1
    ports: ["9090:9090"]
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:11.4.0
    ports: ["3001:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus]

volumes:
  pg_data:
  redis_data:
