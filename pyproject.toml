[project]
name = "rpm"
version = "0.1.0"
description = "Сириус.Еда — API столовой в архитектуре модульного монолита"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.110.0",
    "uvicorn[standard]==0.29.0",
    "websockets>=12",
    "sqlalchemy==2.0.36",
    "psycopg2-binary==2.9.10",
    "pydantic[email]==2.10.6",
    "python-dotenv==1.0.1",
    "pytest==8.3.5",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.5.0",
    "alembic>=1.20.0",
    "redis>=8.1.0",
    "pydantic-settings>=2.15.0",
    "locust>=2.46.7",
    "httpx<0.28",
    "celery>=5.3.6",
    "aio-pika>=9.4,<10",
    "prometheus-client>=0.20",
    "flower>=2.0.1",
    "grpcio>=1.62.0",
    "grpcio-tools>=1.62.0",
    "ruff>=0.17.2",
    "basedpyright>=1.40.2",
    "mypy>=2.4.0",
    "sentry-sdk[fastapi]>=2.0,<3",
    "opentelemetry-sdk>=1.30,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2",
    "opentelemetry-instrumentation-fastapi>=0.51b0,<1",
]

[dependency-groups]
dev = [
    "mutmut>=3,<4",
    "pact-python>=3,<4",
    "testcontainers[postgres]>=4,<5",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mutmut]
source_paths = ["app/modules/orders/service.py"]
pytest_add_cli_args_test_selection = ["tests/test_orders_service.py"]
also_copy = ["app/", "tests/", "pyproject.toml", "delivery_pb2.py", "delivery_pb2_grpc.py"]
